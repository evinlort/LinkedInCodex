[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "linkedin-jobfit"
version = "0.1.0"
description = "Deterministic LinkedIn job-to-profile fit evaluator"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "platformdirs>=4.2,<5",
  "pyyaml>=6,<7",
  "rapidfuzz>=3.9,<4",
  "spacy>=3.8,<4",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "respx>=0.22,<1",
  "ruff>=0.11,<1",
  "types-pyyaml>=6,<7",
]

[project.scripts]
jobfit = "jobfit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jobfit"]

[tool.hatch.build]
include = ["src/jobfit/**/*.py", "src/jobfit/resources/*.yaml"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["jobfit"]

